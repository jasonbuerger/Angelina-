<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BeatLab – Musik erstellen im Browser</title>
  <style>
    :root {
      --bg: #0f1020;
      --panel: #191b36;
      --panel-2: #23264d;
      --accent: #66f2d5;
      --accent-2: #7e7bff;
      --text: #eef0ff;
      --danger: #ff7a9c;
      --muted: #a9afd4;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: radial-gradient(circle at top, #252a58, var(--bg) 45%);
      color: var(--text);
      min-height: 100vh;
      padding: 1.2rem;
    }

    .app {
      max-width: 1100px;
      margin: 0 auto;
      display: grid;
      gap: 1rem;
    }

    .panel {
      background: linear-gradient(140deg, var(--panel), var(--panel-2));
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 1rem;
      padding: 1rem;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.35);
    }

    h1, h2, h3, p { margin: 0; }
    h1 { font-size: clamp(1.4rem, 3vw, 2rem); }
    p { color: var(--muted); }

    .topbar,
    .controls,
    .synth-row,
    .transport,
    .keys {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      align-items: center;
    }

    button,
    input,
    select {
      background: rgba(255,255,255,0.08);
      color: var(--text);
      border: 1px solid rgba(255,255,255,0.13);
      border-radius: 0.6rem;
      padding: 0.55rem 0.75rem;
      font-size: 0.95rem;
    }

    button {
      cursor: pointer;
      transition: 0.2s;
      font-weight: 600;
    }

    button:hover { transform: translateY(-1px); }
    .accent { background: var(--accent); color: #08130f; border-color: transparent; }
    .warn { background: var(--danger); color: #29040f; border-color: transparent; }

    label {
      display: grid;
      gap: 0.35rem;
      min-width: 130px;
      color: var(--muted);
      font-size: 0.84rem;
    }

    input[type="range"] { width: 160px; accent-color: var(--accent); padding: 0; }

    .layout {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 1rem;
    }

    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
    }

    .grid {
      display: grid;
      grid-template-columns: 80px repeat(8, minmax(35px, 1fr));
      gap: 0.35rem;
      margin-top: 0.8rem;
    }

    .grid-label {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      font-size: 0.85rem;
      color: var(--muted);
      padding-left: 0.25rem;
    }

    .step {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 0.45rem;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.04);
    }

    .step.active {
      background: var(--accent-2);
      border-color: rgba(255,255,255,0.6);
      box-shadow: 0 0 0 1px rgba(255,255,255,0.25) inset;
    }

    .step.current {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    .keyboard {
      margin-top: 0.9rem;
      display: grid;
      grid-template-columns: repeat(8, minmax(55px, 1fr));
      gap: 0.5rem;
    }

    .key {
      padding: 0.9rem 0.45rem;
      border-radius: 0.5rem;
      text-align: center;
      font-weight: 700;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.2);
    }

    .log {
      margin-top: 0.8rem;
      max-height: 160px;
      overflow: auto;
      font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size: 0.8rem;
      background: rgba(0,0,0,0.2);
      border-radius: 0.6rem;
      padding: 0.6rem;
      white-space: pre-wrap;
    }

    .pill {
      background: rgba(255,255,255,0.12);
      border-radius: 999px;
      padding: 0.3rem 0.65rem;
      font-size: 0.82rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="panel">
      <div class="topbar">
        <h1>🎛️ BeatLab – Musik erstellen direkt im Browser</h1>
        <span class="pill">Kein Download nötig</span>
      </div>
      <p>Baue Beats mit dem Step-Sequencer, spiele Melodien über die Tastatur und passe den Synth live an.</p>
    </section>

    <section class="layout">
      <article class="panel">
        <h2>1) Sequencer</h2>
        <div class="transport" style="margin-top: .8rem;">
          <button id="startBtn" class="accent">▶ Start</button>
          <button id="stopBtn">■ Stop</button>
          <button id="clearBtn" class="warn">Alles löschen</button>
          <label>BPM
            <input id="bpm" type="range" min="70" max="180" value="110" />
          </label>
          <span id="bpmLabel" class="pill">110 BPM</span>
        </div>

        <div id="seqGrid" class="grid" aria-label="Step-Sequencer"></div>
      </article>

      <article class="panel">
        <h2>2) Synth & Keyboard</h2>
        <div class="synth-row" style="margin-top: .8rem;">
          <label>Wellenform
            <select id="waveform">
              <option value="sine">Sine</option>
              <option value="square">Square</option>
              <option value="sawtooth" selected>Saw</option>
              <option value="triangle">Triangle</option>
            </select>
          </label>

          <label>Filter
            <input id="filter" type="range" min="300" max="6000" value="1800" />
          </label>

          <label>Release
            <input id="release" type="range" min="0.08" max="1.5" step="0.01" value="0.35" />
          </label>

          <label>Lautstärke
            <input id="volume" type="range" min="0" max="1" step="0.01" value="0.55" />
          </label>
        </div>

        <h3 style="margin-top: .9rem;">Maus oder Tasten: A S D F G H J K</h3>
        <div id="keyboard" class="keyboard"></div>

        <div class="log" id="log"></div>
      </article>
    </section>
  </main>

  <script>
    const notes = [
      { name: 'C4', freq: 261.63, key: 'A' },
      { name: 'D4', freq: 293.66, key: 'S' },
      { name: 'E4', freq: 329.63, key: 'D' },
      { name: 'F4', freq: 349.23, key: 'F' },
      { name: 'G4', freq: 392.00, key: 'G' },
      { name: 'A4', freq: 440.00, key: 'H' },
      { name: 'B4', freq: 493.88, key: 'J' },
      { name: 'C5', freq: 523.25, key: 'K' }
    ];

    const seqSteps = 8;
    const sequence = Array.from({ length: notes.length }, () => Array(seqSteps).fill(false));

    const grid = document.getElementById('seqGrid');
    const keyboard = document.getElementById('keyboard');
    const bpmSlider = document.getElementById('bpm');
    const bpmLabel = document.getElementById('bpmLabel');
    const waveform = document.getElementById('waveform');
    const filterSlider = document.getElementById('filter');
    const releaseSlider = document.getElementById('release');
    const volumeSlider = document.getElementById('volume');
    const log = document.getElementById('log');

    let currentStep = 0;
    let timer = null;

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const master = audioCtx.createGain();
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = Number(filterSlider.value);
    master.gain.value = Number(volumeSlider.value);

    filter.connect(master);
    master.connect(audioCtx.destination);

    function addLog(msg) {
      const time = new Date().toLocaleTimeString('de-DE');
      log.textContent = `[${time}] ${msg}\n` + log.textContent;
    }

    function playNote(freq, duration = 0.23) {
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const env = audioCtx.createGain();

      osc.type = waveform.value;
      osc.frequency.value = freq;

      env.gain.setValueAtTime(0, now);
      env.gain.linearRampToValueAtTime(0.85, now + 0.01);
      env.gain.exponentialRampToValueAtTime(0.001, now + duration + Number(releaseSlider.value));

      osc.connect(env);
      env.connect(filter);
      osc.start(now);
      osc.stop(now + duration + Number(releaseSlider.value) + 0.05);
    }

    function renderSequencer() {
      grid.innerHTML = '';
      notes.forEach((note, noteIndex) => {
        const label = document.createElement('div');
        label.className = 'grid-label';
        label.textContent = note.name;
        grid.appendChild(label);

        for (let step = 0; step < seqSteps; step++) {
          const btn = document.createElement('button');
          btn.className = 'step' + (sequence[noteIndex][step] ? ' active' : '') + (step === currentStep ? ' current' : '');
          btn.dataset.noteIndex = noteIndex;
          btn.dataset.step = step;
          btn.addEventListener('click', () => {
            sequence[noteIndex][step] = !sequence[noteIndex][step];
            renderSequencer();
          });
          grid.appendChild(btn);
        }
      });
    }

    function renderKeyboard() {
      keyboard.innerHTML = '';
      notes.forEach((note) => {
        const btn = document.createElement('button');
        btn.className = 'key';
        btn.innerHTML = `${note.name}<br><small>${note.key}</small>`;
        btn.addEventListener('mousedown', async () => {
          await audioCtx.resume();
          playNote(note.freq, 0.35);
          addLog(`Manuell gespielt: ${note.name}`);
        });
        keyboard.appendChild(btn);
      });
    }

    function tick() {
      notes.forEach((note, i) => {
        if (sequence[i][currentStep]) playNote(note.freq);
      });

      renderSequencer();
      currentStep = (currentStep + 1) % seqSteps;
    }

    async function start() {
      await audioCtx.resume();
      if (timer) return;
      currentStep = 0;
      const stepMs = (60 / Number(bpmSlider.value)) * 1000 / 2;
      timer = setInterval(tick, stepMs);
      addLog(`Sequencer gestartet (${bpmSlider.value} BPM)`);
    }

    function stop() {
      clearInterval(timer);
      timer = null;
      currentStep = 0;
      renderSequencer();
      addLog('Sequencer gestoppt');
    }

    document.getElementById('startBtn').addEventListener('click', start);
    document.getElementById('stopBtn').addEventListener('click', stop);
    document.getElementById('clearBtn').addEventListener('click', () => {
      sequence.forEach((row) => row.fill(false));
      renderSequencer();
      addLog('Pattern gelöscht');
    });

    bpmSlider.addEventListener('input', () => {
      bpmLabel.textContent = `${bpmSlider.value} BPM`;
      if (timer) {
        clearInterval(timer);
        timer = null;
        start();
      }
    });

    filterSlider.addEventListener('input', () => {
      filter.frequency.value = Number(filterSlider.value);
    });

    volumeSlider.addEventListener('input', () => {
      master.gain.value = Number(volumeSlider.value);
    });

    window.addEventListener('keydown', async (event) => {
      const pressed = event.key.toUpperCase();
      const note = notes.find((n) => n.key === pressed);
      if (!note || event.repeat) return;
      await audioCtx.resume();
      playNote(note.freq, 0.38);
      addLog(`Taste ${pressed}: ${note.name}`);
    });

    renderSequencer();
    renderKeyboard();
    addLog('BeatLab bereit – setze Steps und drücke Start.');
  </script>
</body>
</html>
